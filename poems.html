    <p>
      Amongst all the fishes in the vast ocean we call the world,
      i found you would you swim? swim a little closer or will you be washed
      away by the waveswe call distance or the currents we call time i hope you
      swim faster ever closer till we meet again. DISTANT WAVES -A. Dimaano
    </p>
